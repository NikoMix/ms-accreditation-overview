site:
  brand: "Microsoft Partner Acceleration"
  title: "Turn specialization ambition into partner-ready delivery."
  subtitle: "A single view of reusable accelerators and hands-on Microhacks for Microsoft Cloud and AI specializations."
  microhackAccessNote: "Microhack repositories currently require authorized GitHub access."
  footerNote: "Community-maintained partner enablement resources. Confirm current specialization requirements in Microsoft Partner Center before an audit."
  repositoryUrl: "https://github.com/NikoMix/ms-accreditation-overview"
  catalogUrl: "https://github.com/NikoMix/ms-accreditation-overview/blob/main/data/specializations.yaml"
  frontierSourceUrl: "https://partner.microsoft.com/en-us/blog/article/engineering-frontier-partner-practice"
  lastUpdated: "2026-08-24"

# Specializations mirror the solution areas published on
# https://partner.microsoft.com/en-us/partnership/specialization
# A specialization listed under more than one solution area repeats the same
# id, title, readiness, and resource links in every area it belongs to.
